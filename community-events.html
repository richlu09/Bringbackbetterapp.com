<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Events | Bring Back Better</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172b51;font:1rem/1.55 system-ui,sans-serif}
main{max-width:48rem;margin:auto;padding:1.5rem}section,article{background:#fff;padding:1rem;margin:1rem 0;border:1px solid #d8e0ed;border-radius:.7rem}
h1,h2,h3{line-height:1.2}label{display:block;margin:.85rem 0}input,textarea,button{font:inherit}input,textarea{display:block;width:100%;padding:.65rem;border:1px solid #66758b;border-radius:.35rem}
button{background:#a52e37;color:#fff;border:0;border-radius:.35rem;padding:.65rem 1rem;margin:.25rem .5rem .25rem 0;cursor:pointer}button:disabled{opacity:.6}a{color:#173e79}
</style>
<script src="./community-events.js" defer></script>
</head>
<body>
<main>
<a href="./">Bring Back Better home</a>
<h1>Community events</h1>
<section aria-labelledby="upcoming">
<h2 id="upcoming">Upcoming events</h2>
<p id="calendar-status" role="status">Loading events…</p>
<div id="calendar"></div>
</section>
<section aria-labelledby="submit-heading">
<h2 id="submit-heading">Submit a local event</h2>
<p>Approved events appear on this page. Use a public venue and include only information you want visitors to see.</p>
<form id="submit-event">
<label>Event name<input name="name" required maxlength="100"></label>
<label>Date<input name="date" type="date" required></label>
<label>Venue and city<input name="venue" required maxlength="150"></label>
<label>Details<textarea name="description" required maxlength="800" rows="4"></textarea></label>
<button disabled>Send for review</button>
<p id="submit-status" role="status"></p>
</form>
</section>
<details>
<summary>Organizer review</summary>
<form id="review-login">
<label>Review access key<input name="token" required type="password" autocomplete="current-password"></label>
<button>Load pending events</button>
</form>
<p id="review-status" role="status"></p>
<div id="review-list"></div>
</details>
<p><a href="./events.html">Open your private event planner</a></p>
</main>
</body>
</html>
